<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#180b33" />
      <stop offset="100%" stop-color="#080314" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe885" />
      <stop offset="35%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa7c11" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#9d4edd" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0518" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sacredGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#d4af37" opacity="0.25"/>
      <path d="M 0 20 L 40 20 M 20 0 L 20 40" stroke="#9d4edd" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="300" height="500" rx="16" fill="url(#bgGrad)" />
  <rect width="300" height="500" rx="16" fill="url(#sacredGrid)" />

  <!-- Outer & Inner Gold Borders -->
  <rect x="12" y="12" width="276" height="476" rx="12" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
  <rect x="18" y="18" width="264" height="464" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.7" />
  <rect x="25" y="25" width="250" height="450" rx="6" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" />

  <!-- Corner Ornaments -->
  <g stroke="url(#goldGrad)" stroke-width="1" fill="none">
    <!-- Top Left -->
    <path d="M 25 45 Q 45 45 45 25" />
    <circle cx="45" cy="45" r="3" fill="url(#goldGrad)" />
    <!-- Top Right -->
    <path d="M 275 45 Q 255 45 255 25" />
    <circle cx="255" cy="45" r="3" fill="url(#goldGrad)" />
    <!-- Bottom Left -->
    <path d="M 25 455 Q 45 455 45 475" />
    <circle cx="45" cy="455" r="3" fill="url(#goldGrad)" />
    <!-- Bottom Right -->
    <path d="M 275 455 Q 255 455 255 475" />
    <circle cx="255" cy="455" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Center Aura -->
  <circle cx="150" cy="250" r="110" fill="url(#sunGlow)" />

  <!-- Sacred Geometry Central Wheel -->
  <g transform="translate(150, 250)" stroke="url(#goldGrad)" fill="none">
    <!-- Outer concentric rings -->
    <circle r="92" stroke-width="1.5" />
    <circle r="86" stroke-width="0.8" stroke-dasharray="3,3" />
    <circle r="72" stroke-width="1.2" />
    <circle r="52" stroke-width="1" />
    <circle r="32" stroke-width="1.5" />
    
    <!-- 12 Radiating Sun Rays -->
    <g stroke-width="1.2">
      <line x1="0" y1="-86" x2="0" y2="-72" />
      <line x1="0" y1="86" x2="0" y2="72" />
      <line x1="-86" y1="0" x2="-72" y2="0" />
      <line x1="86" y1="0" x2="72" y2="0" />
      <line x1="-60.8" y1="-60.8" x2="-50.9" y2="-50.9" />
      <line x1="60.8" y1="60.8" x2="50.9" y2="50.9" />
      <line x1="-60.8" y1="60.8" x2="-50.9" y2="50.9" />
      <line x1="60.8" y1="-60.8" x2="50.9" y2="-50.9" />
    </g>

    <!-- Octagram / Star of Ishtar -->
    <polygon points="0,-68 48,-48 68,0 48,48 0,68 -48,48 -68,0 -48,-48" stroke-width="1" />
    <polygon points="0,-68 18,-18 68,0 18,18 0,68 -18,18 -68,0 -18,-18" fill="url(#goldGrad)" fill-opacity="0.18" stroke-width="1.2" />

    <!-- Central Mystic Eye / Sun Core -->
    <circle r="16" fill="url(#goldGrad)" fill-opacity="0.3" stroke-width="1.5" />
    <circle r="6" fill="url(#goldGrad)" />
  </g>

  <!-- Top Celestial Motif (Crescent Moon & Star) -->
  <g transform="translate(150, 95)" stroke="url(#goldGrad)" fill="none">
    <path d="M 0 -22 A 22 22 0 1 0 18 14 A 18 18 0 1 1 0 -22 Z" fill="url(#goldGrad)" fill-opacity="0.25" stroke-width="1.2" />
    <polygon points="0,-4 3,3 10,0 4,5 7,12 1,7 -4,11 -2,5 -8,1 -2,2" fill="url(#goldGrad)" />
    <circle cx="-35" cy="0" r="1.5" fill="url(#goldGrad)" />
    <circle cx="35" cy="0" r="1.5" fill="url(#goldGrad)" />
    <line x1="-50" y1="0" x2="-25" y2="0" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="25" y1="0" x2="50" y2="0" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>

  <!-- Bottom Celestial Motif (Inverted Crescent Moon & Star) -->
  <g transform="translate(150, 405)" stroke="url(#goldGrad)" fill="none">
    <path d="M 0 22 A 22 22 0 1 0 -18 -14 A 18 18 0 1 1 0 22 Z" fill="url(#goldGrad)" fill-opacity="0.25" stroke-width="1.2" />
    <polygon points="0,4 3,-3 10,0 4,-5 7,-12 1,-7 -4,-11 -2,-5 -8,-1 -2,-2" fill="url(#goldGrad)" />
    <circle cx="-35" cy="0" r="1.5" fill="url(#goldGrad)" />
    <circle cx="35" cy="0" r="1.5" fill="url(#goldGrad)" />
    <line x1="-50" y1="0" x2="-25" y2="0" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="25" y1="0" x2="50" y2="0" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>
</svg>

